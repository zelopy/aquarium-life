name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:deploy
      - run: npm ci --prefix infra
      - run: npm test --prefix infra
